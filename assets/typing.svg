<svg xmlns="http://www.w3.org/2000/svg" width="641" height="70" viewBox="0 0 641 70" role="img" aria-label="Welcome to my GitHub profile page!">
  <title>Welcome to my GitHub profile page!</title>
  <defs>
    <clipPath id="typingReveal">
      <rect x="0" y="0" width="0" height="70">
        <animate attributeName="width"
                 values="0;601;601;0;0"
                 keyTimes="0;0.55;0.85;0.96;1"
                 dur="9s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <style>
      .typing { font-family: 'Fira Code','Cascadia Code',Consolas,monospace; font-size: 26px; fill: #0C82F7; }
    </style>
  </defs>
  <text class="typing" x="40" y="43" textLength="561" lengthAdjust="spacingAndGlyphs" clip-path="url(#typingReveal)">Welcome to my GitHub profile page!</text>
  <rect x="40" y="21" width="3" height="32" fill="#0C82F7">
    <animate attributeName="x"
             values="40;601;601;40;40"
             keyTimes="0;0.55;0.85;0.96;1"
             dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.5;1;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
